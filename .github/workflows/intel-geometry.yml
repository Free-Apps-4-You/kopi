name: Intel geometry diagnostics

on: workflow_dispatch

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compare SwiftUI and Core Graphics hit testing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          geometry = Path('Sources/KopiCore/App/RadialSelection.swift').read_text()
          geometry = geometry[geometry.index('public enum RadialGeometry'):geometry.index('public enum RadialSelection')]
          source = Path('Sources/Kopi/Views/RadialView.swift').read_text()
          shape = source[source.index('struct RadialSegment: Shape'):source.index('/// A complete, sharp image')]
          probe = '''
          let rect = CGRect(x: 0, y: 0, width: 440, height: 440)
          let center = CGPoint(x: 220, y: 220)
          var failures = 0
          for count in 1...8 {
              for index in 0..<count {
                  let original = RadialSegment(index: index, count: count).path(in: rect)
                  for progress in [0.0, 0.2, 0.5, 0.8, 1.0] {
                      let scale = 1 + 0.05 * progress
                      var t = CGAffineTransform(a: scale, b: 0, c: 0, d: scale, tx: 220 * (1 - scale), ty: 220 * (1 - scale))
                      let path = original.applying(t)
                      let swiftHit = path.contains(center, eoFill: count == 1)
                      let cgHit = path.cgPath.contains(center, using: count == 1 ? .evenOdd : .winding)
                      let cgTransformHit = original.cgPath.copy(using: &t)!.contains(center, using: count == 1 ? .evenOdd : .winding)
                      let rebuiltHit = Path(path.cgPath).contains(center, eoFill: count == 1)
                      if swiftHit || cgHit || cgTransformHit || rebuiltHit {
                          failures += 1
                          print("count=\\(count) index=\\(index) progress=\\(progress) SwiftUI=\\(swiftHit) CG=\\(cgHit) CGTransform=\\(cgTransformHit) rebuilt=\\(rebuiltHit)")
                      }
                  }
              }
          }
          print("Center failures: \\(failures)")
          '''
          import re
          tests = Path('Tests/KopiCoreTests/RadialTests.swift').read_text()
          tests = tests[tests.index('@Suite("Radial segment hit regions")'):tests.index('import CoreText')] + tests[tests.index('@Suite("Radial outward magnification")'):]
          tests = re.sub(r'@Suite\([^\n]*\)\n', '', tests).replace('@Test ', '').replace('#expect(', 'precondition(')
          tests += '''
          RadialSegmentTests().segmentsCoverTheRingWithoutOverlappingTheHub()
          RadialMagnificationTests().focusedSliceNeverCoversItsUnchangedNeighbors()
          RadialMagnificationTests().transferringFocusKeepsEverySliceSeparate()
          RadialMagnificationTests().expandedWheelAndControlsFitWithoutColliding()
          print("All four Core Graphics geometry checks passed on Intel")
          '''
          probe += tests
          Path('/tmp/kopi-geometry.swift').write_text('import SwiftUI\n' + geometry + shape + probe)
          PY
          swift /tmp/kopi-geometry.swift
