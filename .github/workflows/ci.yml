name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # The runner defaults to Xcode 16.4 / Swift 6.1, which crashes in IRGen
      # for actor-isolated SwiftUI bindings. Select the supported toolchain.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Run regression tests
        run: swift test --no-parallel
      - name: Run isolated storage self-check
        run: swift run Copily --selfcheck
      - name: Build application bundle
        run: scripts/build-app.sh
      - name: Verify application signature
        run: codesign --verify --deep --strict dist/Copily.app
      - name: Create and verify DMG and application ZIP
        run: scripts/build-dmg.sh
      - name: Upload DMG and application ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Copily-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
