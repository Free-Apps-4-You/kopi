name: macOS checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      # The runner defaults to Xcode 16.4 / Swift 6.1, which crashes in IRGen
      # for actor-isolated SwiftUI bindings. Select the supported toolchain.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tagged application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Show Swift toolchain
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          swift --version
      - name: Run regression tests
        run: |
          if [[ "$EXPECTED_ARCH" == "x86_64" ]]; then
            # The Intel runner's virtual Metal device aborts inside ImageRenderer.
            # Only this GPU snapshot is excluded; it still runs on Apple Silicon.
            swift test --no-parallel --skip panelBackgroundDoesNotDependOnBackdropCompositing
          else
            swift test --no-parallel
          fi
      - name: Run isolated storage self-check
        run: swift run Kopi --selfcheck
      - name: Build application bundle
        run: scripts/build-app.sh
      - name: Verify application signature
        run: codesign --verify --deep --strict dist/Kopi.app
      - name: Run packaged application self-check
        run: dist/Kopi.app/Contents/MacOS/Kopi --selfcheck
      - name: Create and verify DMG and application ZIP
        run: scripts/build-dmg.sh
      - name: Upload DMG and application ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kopi-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve annotated tag notes instead of only the tagged commit message.
          fetch-depth: 0
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: Kopi-macOS-*
          merge-multiple: true
          path: dist
      - name: Publish DMG and application ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<EOF
          ## Download Kopi for your Mac

          Requires **macOS 14 or later**. Choose the installer for your processor:

          | Your Mac | DMG installer (recommended) | Application ZIP |
          | --- | --- | --- |
          | **Intel Mac** — Intel processors, including 2019 MacBooks | [Download Intel DMG](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/Kopi-Intel-Mac.dmg) | [Intel ZIP](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/Kopi-Intel-Mac.zip) |
          | **Apple Silicon Mac** — M-series chips, M1 and later | [Download Apple Silicon DMG](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/Kopi-Apple-Silicon-Mac.dmg) | [Apple Silicon ZIP](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/Kopi-Apple-Silicon-Mac.zip) |

          Check **Apple menu → About This Mac** for your processor. Open the DMG and drag **Kopi** into **Applications**.

          ---

          EOF
          tag_object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          gh api "repos/$GH_REPO/git/tags/$tag_object" --jq .message >> release-notes.md
          gh release create "$RELEASE_TAG" \
            "dist/Kopi-Intel-Mac.dmg#Kopi-Intel-Mac.dmg — Intel processor Macs, macOS 14+" \
            "dist/Kopi-Apple-Silicon-Mac.dmg#Kopi-Apple-Silicon-Mac.dmg — M1 and later Macs, macOS 14+" \
            "dist/Kopi-Intel-Mac.zip#Kopi-Intel-Mac.zip — Intel Mac application archive" \
            "dist/Kopi-Apple-Silicon-Mac.zip#Kopi-Apple-Silicon-Mac.zip — Apple Silicon Mac application archive" \
            --verify-tag --notes-file release-notes.md --title "Kopi ${RELEASE_TAG#v}" --latest
