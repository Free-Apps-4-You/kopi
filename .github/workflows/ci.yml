name: macOS checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      # The runner defaults to Xcode 16.4 / Swift 6.1, which crashes in IRGen
      # for actor-isolated SwiftUI bindings. Select the supported toolchain.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tagged application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Show Swift toolchain
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          swift --version
      - name: Run regression tests
        run: swift test --no-parallel
      - name: Run isolated storage self-check
        run: swift run Kopi --selfcheck
      - name: Build application bundle
        run: scripts/build-app.sh
      - name: Verify application signature
        run: codesign --verify --deep --strict dist/Kopi.app
      - name: Run packaged application self-check
        run: dist/Kopi.app/Contents/MacOS/Kopi --selfcheck
      - name: Create and verify DMG and application ZIP
        run: scripts/build-dmg.sh
      - name: Upload DMG and application ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kopi-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: Kopi-macOS-*
          merge-multiple: true
          path: dist
      - name: Publish DMG and application ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.dmg dist/*.zip \
            --verify-tag --notes-from-tag --title "Kopi ${RELEASE_TAG#v}" --latest
